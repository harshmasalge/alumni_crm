# Production nginx for the CRM SPA on Render.
# The app uses hash routing (#/people/...), so every non-asset path
# falls back to index.html. Render rewrites `listen 80` to $PORT at
# container start (see Dockerfile CMD).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
